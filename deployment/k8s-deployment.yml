apiVersion: v1
kind: Namespace
metadata:
  name: security-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: security-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      containers:
      - name: app
        image: vulnerable-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: security-demo
spec:
  selector:
    app: vulnerable-app
  ports:
  - port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: security-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      containers:
      - name: waf
        image: waf:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: security-demo
spec:
  type: NodePort
  selector:
    app: waf
  ports:
  - port: 8080
    nodePort: 30080
